name: OOMU Weekly Naver Regional Places & 2040 Search Trend Crawler

on:
  schedule:
    # 매주 월요일 03:00 KST. 가입된 동네의 검증된 장소와 선정 키워드 관심도 갱신
    - cron: '0 18 * * 0'
  workflow_dispatch:

jobs:
  crawl-naver-places-and-trends:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Firestore authentication library
        run: python -m pip install 'google-auth>=2.35,<3'

      - name: Run Naver Regional Places & 2040 DataLab Trend Crawler
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
          NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
          NAVER_MAP_CLIENT_ID: ${{ secrets.NAVER_MAP_CLIENT_ID }}
          NAVER_MAP_CLIENT_SECRET: ${{ secrets.NAVER_MAP_CLIENT_SECRET }}
        run: |
          python scripts/crawl_naver_regional_places.py
