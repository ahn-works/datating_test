name: Daily Local City Events Crawler & Auto-Sync

on:
  schedule:
    # 매일 아침 07:30 KST (UTC 22:30) 자동 실행
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      target_cities:
        description: '크롤링할 시·구 목록 (비워두면 전국 6대 권역 + 앱 내 활성 유저 거주지 전체 자동 감지)'
        required: false
        default: ''
      max_per_query:
        description: '권역·카테고리별 최대 수집 건수'
        required: false
        default: '3'

permissions:
  contents: write

jobs:
  crawl-and-commit:
    runs-on: ubuntu-latest
    name: Crawl Nationwide & User-Region Events -> GitHub + Spot App Firestore

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Nationwide & Active-User Region Event Crawler
        env:
          TARGET_CITIES: ${{ github.event.inputs.target_cities || '' }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          APP_WEBHOOK_URL: ${{ secrets.APP_WEBHOOK_URL }}
        run: |
          python scripts/crawl_local_events.py --output-dir data --max-per-query ${{ github.event.inputs.max_per_query || '3' }}

      - name: Commit and Push Updated Event Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경된 모임·이벤트 데이터가 없습니다."
          else
            git commit -m "chore(data): update daily nationwide & user-region events [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
