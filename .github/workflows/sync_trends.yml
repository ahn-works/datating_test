name: OOMU Trend Crawler (KOPIS·스포츠·영화·R2)

on:
  schedule:
    # 매일 한국 시간 새벽 4시 (UTC 19:00) KOPIS 공연 + KBO/K리그 스포츠 + 실시간 영화 포스터 자동 크롤링 및 동기화
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      keywords:
        description: '추가로 포스터를 크롤링할 공연/스포츠/영화 키워드 (쉼표 구분, 비워두면 자동 수집)'
        required: false
        default: '서울재즈페스티벌, LG 트윈스, 파묘'

jobs:
  sync-trends-and-posters:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install boto3

      - name: Crawl KOPIS / Sports / Movie Posters & Sync to R2 + Firestore
        env:
          INPUT_KEYWORDS: ${{ github.event.inputs.keywords }}
        run: |
          python scripts/sync_trends.py

      - name: 🧹 Purge 3-Day Expired Events & Clean Cloudflare R2
        run: |
          python scripts/cleanup_stale_data.py --days 3

