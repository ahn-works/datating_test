name: Flutter Web Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'data/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Run Flutter Static Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run unit & widget tests
        run: flutter test
      - name: Run Design Token Check
        run: python3 scripts/check_design_tokens.py --compare
      - name: Enable Web Platform
        run: flutter create . --platforms web
      - name: Inject Daum Postcode JS
        run: |
          sed -i "s|</head>|<script src=\"https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js\"></script></head>|" web/index.html
      - name: Build Web
        id: build
        env:
          KAKAO_KEY: ${{ secrets.KAKAO_JS_API_KEY }}
          KAKAO_REST: ${{ secrets.KAKAO_REST_API_KEY }}
          NAVER_MAP_ID: ${{ secrets.NAVER_MAP_CLIENT_ID }}
          SOLAPI_KEY: ${{ secrets.SOLAPI_API_KEY }}
          SOLAPI_SECRET: ${{ secrets.SOLAPI_API_SECRET }}
          SOLAPI_SENDER: ${{ secrets.SOLAPI_SENDER_NUMBER }}
          SOLAPI_PFID: ${{ secrets.SOLAPI_KAKAO_PFID }}
          SOLAPI_TPL: ${{ secrets.SOLAPI_KAKAO_TEMPLATE_ID }}
        run: |
          flutter build web --base-href /datating_test/ --dart-define=KAKAO_JS_API_KEY=${KAKAO_KEY} --dart-define=KAKAO_REST_API_KEY=${KAKAO_REST} --dart-define=NAVER_MAP_CLIENT_ID=${NAVER_MAP_ID} --dart-define=SOLAPI_API_KEY=${SOLAPI_KEY} --dart-define=SOLAPI_API_SECRET=${SOLAPI_SECRET} --dart-define=SOLAPI_SENDER_NUMBER=${SOLAPI_SENDER} --dart-define=SOLAPI_KAKAO_PFID=${SOLAPI_PFID} --dart-define=SOLAPI_KAKAO_TEMPLATE_ID=${SOLAPI_TPL} > build_log.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV
      - name: Print build errors as annotations
        if: env.BUILD_FAILED == 'true'
        run: |
          cat build_log.txt
          while IFS= read -r l; do echo "::error::$l"; done < build_log.txt
          exit 1
      - name: Push log on failure
        if: env.BUILD_FAILED == 'true'
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add build_log.txt
          git commit -m "upload build log"
          git pull --rebase origin main
          git push origin main
          exit 1
      - name: Deploy to GitHub Pages
        if: env.BUILD_FAILED != 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
