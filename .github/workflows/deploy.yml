name: Flutter Web Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Enable Web Platform
        run: flutter create . --platforms web
      - name: Build Web
        id: build
        run: |
          flutter build web --base-href /datating_test/ > build_log.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV
      - name: Push log on failure
        if: env.BUILD_FAILED == 'true'
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add build_log.txt
          git commit -m "upload build log"
          git pull --rebase origin main
          git push origin main
          exit 1
      - name: Deploy to GitHub Pages
        if: env.BUILD_FAILED != 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
