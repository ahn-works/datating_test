<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="/datating_test/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="내 동네에서 가볼 곳을 발견하고, 취향이 맞는 이웃과 함께하는 OOMU">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="preload" as="script" href="main.dart.js">
  <title>OOMU · 우리 동네 모임</title>
  <script>
    // Force unregister stale service worker to ensure fresh design is loaded
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script></head>
<body style="margin:0;padding:0;background:#FFFFFF;">
  <div id="oomu-loading-splash" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:-apple-system,BlinkMacSystemFont,Pretendard,Roboto,sans-serif;">
    <div style="width:72px;height:72px;background:#F25767;border-radius:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(242,87,103,0.25);margin-bottom:20px;">
      <span style="color:#FFFFFF;font-size:28px;font-weight:900;letter-spacing:-1px;">O</span>
    </div>
    <div style="font-size:18px;font-weight:800;color:#1A1A1A;letter-spacing:-0.5px;margin-bottom:6px;">OOMU</div>
    <div style="font-size:13px;color:#8E8E93;font-weight:500;">동네 모임과 새로운 발견을 불러오는 중...</div>
  </div>
  <script>
    function hideOomuSplash() {
      var splash = document.getElementById('oomu-loading-splash');
      if (splash && splash.style.display !== 'none') {
        splash.style.transition = 'opacity 0.3s ease-out';
        splash.style.opacity = '0';
        setTimeout(function() {
          try { splash.remove(); } catch (_) { splash.style.display = 'none'; }
        }, 300);
      }
    }
    window.addEventListener('flutter-first-frame', hideOomuSplash);
    var observer = new MutationObserver(function(mutations, obs) {
      if (document.querySelector('flt-glass-pane, flutter-view, flt-scene-host, canvas')) {
        setTimeout(hideOomuSplash, 500);
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
    setTimeout(hideOomuSplash, 7000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
